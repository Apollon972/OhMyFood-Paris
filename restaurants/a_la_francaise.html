<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Shrikhand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/main.css">
    <link rel="stylesheet" href="/assets/fontawesome/css/fontawesome.css">
    <link rel="stylesheet" href="/assets/fontawesome/css/brands.css">
    <link rel="stylesheet" href="/assets/fontawesome/css/solid.css">
    <link rel="stylesheet" href="/assets/fontawesome/css/regular.css">
    <title>Ohmyfood</title>
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="/index.html">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <img src="/assets/images/logo/ohmyfood.png" alt="logo">
        </nav>
    </header>
    <main>
        <div class="div_bg">
            <img src="/assets/images/restaurants/toa-heftiba-DQKerTsQwi0-unsplash.jpg" alt="">
        </div>
        <section class="menu">
            <div class="section_title">
                <h2>A la française</h2>
                <div class="heartContainer_restau">
                    <input type="checkbox" id="heartCheckbox">
                    <i class="fa-regular fa-heart"></i>
                    <i class="fa-solid fa-heart"></i>
                </div>
            </div>
            <div class="menu_list" id="menu_list_entrees">
                <h3>Entrées</h3>
                <div class="underline"></div>
                <div class="menu-card">
                    <input type="checkbox" id="menu-checkbox-1" hidden>
                    <label for="menu-checkbox-1">
                    <span class="menu-info">
                        <span class="menu-title">Tartare de poulpe acidulé</span>
                        <br>
                        <span class="menu-details">Aux zestes d'orange</span>
                    </span>
                    <span class="menu-price">25€</span>
                    <i class="menu-checkmark fa-solid fa-circle-check"></i>
                </label>
                </div>
                <div class="menu-card">
                    <input type="checkbox" id="menu-checkbox-2" hidden>
                    <label for="menu-checkbox-2">
                    <span class="menu-info">
                        <span class="menu-title">Velouté de légumes d'antan</span>
                        <br>
                        <span class="menu-details">Carotte,panais,topinambour</span>
                    </span>
                    <span class="menu-price">35€</span>
                    <i class="menu-checkmark fa-solid fa-circle-check"></i>
                </label>
                </div>
                <div class="menu-card">
                    <input type="checkbox" id="menu-checkbox-3" hidden>
                    <label for="menu-checkbox-3">
                    <span class="menu-info">
                        <span class="menu-title">Soupe à l'oignon</span>
                        <br>
                        <span class="menu-details">Revisitée</span>
                    </span>
                    <span class="menu-price">20€</span>
                    <i class="menu-checkmark fa-solid fa-circle-check"></i>
                </label>
                </div>
            </div>
            <div class="menu_list" id="menu_list_plats">
                <h3>Plats</h3>
                <div class="underline"></div>
                <div class="menu-card">
                    <input type="checkbox" id="menu-checkbox-4" hidden>
                    <label for="menu-checkbox-4">
                    <span class="menu-info">
                        <span class="menu-title">Coquilles Saint-Jacques</span>
                        <br>
                        <span class="menu-details">Accompagnées d'une purée de panais</span>
                    </span>
                    <span class="menu-price">40€</span>
                    <i class="menu-checkmark fa-solid fa-circle-check"></i>
                </label>
                </div>
                <div class="menu-card">
                    <input type="checkbox" id="menu-checkbox-5" hidden>
                    <label for="menu-checkbox-5">
                    <span class="menu-info">
                        <span class="menu-title">Magret de canard</span>
                        <br>
                        <span class="menu-details">Et parmentier de pommes de terre</span>
                    </span>
                    <span class="menu-price">35€</span>
                    <i class="menu-checkmark fa-solid fa-circle-check"></i>
                </label>
                </div>
                <div class="menu-card">
                    <input type="checkbox" id="menu-checkbox-6" hidden>
                    <label for="menu-checkbox-6">
                    <span class="menu-info">
                        <span class="menu-title">Pigeonneau d'Ille-et-Vilaine</span>
                        <br>
                        <span class="menu-details">Sur son lit de gnocchis aux légumes</span>
                    </span>
                    <span class="menu-price">44€</span>
                    <i class="menu-checkmark fa-solid fa-circle-check"></i>
                </label>
                </div>
            </div>
            <div class="menu_list" id="menu_list_desserts">
                <h3>Desserts</h3>
                <div class="underline"></div>
                <div class="menu-card">
                    <input type="checkbox" id="menu-checkbox-7" hidden>
                    <label for="menu-checkbox-7">
                    <span class="menu-info">
                        <span class="menu-title">Pétales de violettes glacés</span>
                        <br>
                        <span class="menu-details">Et purée de noisettes</span>
                    </span>
                    <span class="menu-price">18€</span>
                    <i class="menu-checkmark fa-solid fa-circle-check"></i>
                </label>
                </div>
                <div class="menu-card">
                    <input type="checkbox" id="menu-checkbox-8" hidden>
                    <label for="menu-checkbox-8">
                    <span class="menu-info">
                        <span class="menu-title">Fondant au chocolat</span>
                        <br>
                        <span class="menu-details">Revisité</span>
                    </span>
                    <span class="menu-price">22€</span>
                    <i class="menu-checkmark fa-solid fa-circle-check"></i>
                </label>
                </div>
                <div class="menu-card">
                    <input type="checkbox" id="menu-checkbox-9" hidden>
                    <label for="menu-checkbox-9">
                    <span class="menu-info">
                        <span class="menu-title">Millefeuille croustillant</span>
                        <br>
                        <span class="menu-details">Myrtilles et pâte d'amande</span>
                    </span>
                    <span class="menu-price">23€</span>
                    <i class="menu-checkmark fa-solid fa-circle-check"></i>
                </label>
                </div>
            </div>
            <button class="btn_explorer2">Commander</button>
        </section>
    </main>
    <footer>
        <div>
            <img src="/assets/images/logo/ohmyfood_bnw.png" alt="logo">
            <a href="#">
                <i class="fa-solid fa-utensils"></i>
                Proposer un restaurant
            </a>
            <a href="#">
                <i class="fa-solid fa-handshake-angle"></i>
                Devenir partenaire
            </a>
            <a href="#">Mentions légales</a>
            <a href="#">Contact</a>
        </div>
    </footer>
</body>
</html>
