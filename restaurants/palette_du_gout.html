<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Shrikhand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/main.css">
    <link rel="stylesheet" href="/assets/fontawesome/css/fontawesome.css">
    <link rel="stylesheet" href="/assets/fontawesome/css/brands.css">
    <link rel="stylesheet" href="/assets/fontawesome/css/solid.css">
    <link rel="stylesheet" href="/assets/fontawesome/css/regular.css">
    <title>Ohmyfood</title>
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="/index.html">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <img src="/assets/images/logo/ohmyfood.png" alt="logo">
        </nav>
    </header>
    <main>
        <div class="div_bg">
            <img src="/assets/images/restaurants/la-palette-du-gout.jpg" alt="">
        </div>
        <section class="menu">
            <div class="section_title">
                <h2>La palette du goût</h2>
                <div class="heartContainer_restau">
                    <input type="checkbox" id="heartCheckbox">
                    <i class="fa-regular fa-heart"></i>
                    <i class="fa-solid fa-heart"></i>
                </div>
            </div>
            <div class="menu_list" id="menu_list_entrees">
                <h4>Entrées</h4>
                <div class="underline"></div>
                <div class="menu-card">
                    <input type="checkbox" id="menu-checkbox-1" hidden>
                    <label for="menu-checkbox-1">
                        <div class="menu-info">
                            <p class="menu-title">Fricassée d'escargots</p>
                            <p class="menu-details">Au piment d'Espelette</p>
                        </div>
                        <div class="menu-price">25€</div>
                            <i class="menu-checkmark fa-solid fa-circle-check"></i>
                    </label>
                    </div>
                <div class="menu-card">
                    <input type="checkbox" id="menu-checkbox-2" hidden>
                    <label for="menu-checkbox-2">
                    <div class="menu-info">
                        <p class="menu-title">Foie gras de canard mi-cuit</p>
                        <p class="menu-details">Et ses copeaux de truffe noire</p>
                    </div>
                    <div class="menu-price">35€</div>
                    <i class="menu-checkmark fa-solid fa-circle-check"></i>
                </label>
                </div>
                <div class="menu-card">
                    <input type="checkbox" id="menu-checkbox-3" hidden>
                    <label for="menu-checkbox-3">
                    <div class="menu-info">
                        <p class="menu-title">Œuf au plat</p>
                        <p class="menu-details">Assaisonné à la truffe sur lit de caviar</p>
                    </div>
                    <div class="menu-price">20€</div>
                    <i class="menu-checkmark fa-solid fa-circle-check"></i>
                </label>
                </div>
            </div>
            <div class="menu_list"id="menu_list_plats">
                <h4>Plats</h4>
                <div class="underline"></div>
                <div class="menu-card">
                    <input type="checkbox" id="menu-checkbox-4" hidden>
                    <label for="menu-checkbox-4">
                    <div class="menu-info">
                        <p class="menu-title">Filet de bœuf aux herbes</p>
                        <p class="menu-details">Accompagné de sa ribambelle de légumes</p>
                    </div>
                    <div class="menu-price">40€</div>
                    <i class="menu-checkmark fa-solid fa-circle-check"></i>
                </label>
                </div>
                <div class="menu-card">
                    <input type="checkbox" id="menu-checkbox-5" hidden>
                    <label for="menu-checkbox-5">
                    <div class="menu-info">
                        <p class="menu-title">Parmentier de queue de bœuf</p>
                        <p class="menu-details">A la truffe noire sur sa purée de panais</p>
                    </div>
                    <div class="menu-price">35€</div>
                    <i class="menu-checkmark fa-solid fa-circle-check"></i>
                </label>
                </div>
                <div class="menu-card">
                    <input type="checkbox" id="menu-checkbox-6" hidden>
                    <label for="menu-checkbox-6">
                    <div class="menu-info">
                        <p class="menu-title">Filet de turbot</p>
                        <p class="menu-details">Aux agrumes</p>
                    </div>
                    <div class="menu-price">44€</div>
                    <i class="menu-checkmark fa-solid fa-circle-check"></i>
                </label>
                </div>
            </div>
            <div class="menu_list" id="menu_list_desserts">
                <h4>Desserts</h4>
                <div class="underline"></div>
                <div class="menu-card">
                    <input type="checkbox" id="menu-checkbox-7" hidden>
                    <label for="menu-checkbox-7">
                    <div class="menu-info">
                        <p class="menu-title">Paris-Brest</p>
                        <p class="menu-details">Revisité</p>
                    </div>
                    <div class="menu-price">18€</div>
                    <i class="menu-checkmark fa-solid fa-circle-check"></i>
                </label>
                </div>
                <div class="menu-card">
                    <input type="checkbox" id="menu-checkbox-8" hidden>
                    <label for="menu-checkbox-8">
                    <div class="menu-info">
                        <p class="menu-title">Macaron au chocolat d'exception</p>
                        <p class="menu-details">Et glace à la vanille de Madagascar</p>
                    </div>
                    <div class="menu-price">22€</div>
                    <i class="menu-checkmark fa-solid fa-circle-check"></i>
                </label>
                </div>
                <div class="menu-card">
                    <input type="checkbox" id="menu-checkbox-9" hidden>
                    <label for="menu-checkbox-9">
                    <div class="menu-info">
                        <p class="menu-title">Mousse au chocolat</p>
                        <p class="menu-details">Au piment d'Espelette et à la truffe noire</p>
                    </div>
                    <div class="menu-price">23€</div>
                    <i class="menu-checkmark fa-solid fa-circle-check"></i>
                </label>
                    </div>
            </div>
            <button class="btn_explorer2">Commander</button>
        </section>
    </main>
    <footer>
        <div>
            <img src="/assets/images/logo/ohmyfood_bnw.png" alt="logo">
            <a href="#">
                <i class="fa-solid fa-utensils"></i>
                Proposer un restaurant
            </a>
            <a href="#">
                <i class="fa-solid fa-handshake-angle"></i>
                Devenir partenaire
            </a>
            <a href="#">Mentions légales</a>
            <a href="#">Contact</a>
        </div>
    </footer>
</body>
</html>
